server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: everything that isn't a real file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + audio to the backend service (Docker DNS name: api).
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Audio streaming needs range requests to seek.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
    }
}
